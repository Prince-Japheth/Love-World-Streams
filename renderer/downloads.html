<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloads — LoveWorld Streams</title>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="popup">
    <header class="popup-header">
        <span class="popup-title">Downloads</span>
        <button id="popup-close" type="button" title="Close" aria-label="Close">✕</button>
    </header>
    <main class="popup-main">
        <div style="padding: 12px 12px 0 12px;">
            <button class="btn ghost" id="open-folder-btn" style="width: 100%; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px;">
                <svg style="width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                Open Downloads Folder
            </button>
        </div>
        <div id="detected" style="margin-bottom: 16px;"></div>
        <div class="popup-title" style="font-size: 11px; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;">Active Downloads</div>
        <div id="list"></div>
        <div id="status" class="hint" style="margin-top: 16px;"></div>
    </main>
    <script src="downloads.js"></script>
</body>
</html>
